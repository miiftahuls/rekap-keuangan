<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Keuangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #0f172a;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-red: #f43f5e;
      --accent-blue: #38bdf8;
      --btn-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --btn-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 540px;
      margin: auto;
      background: var(--bg-card);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    h2 {
      margin: 0 0 20px 0;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .card {
      padding: 14px 10px;
      border-radius: 12px;
      text-align: center;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
    }

    .card span {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .card strong {
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }

    .in { color: var(--accent-green); }
    .out { color: var(--accent-red); }
    .bal { color: var(--accent-blue); }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input, select {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: #64748b; }

    input:focus, select:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 13px;
      background: var(--btn-gradient);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      margin-top: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
    }

    button:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
    }

    button:active { transform: translateY(0); }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      margin: 28px 0 12px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12px;
    }

    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-in {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
    }

    .badge-out {
      background: rgba(244, 63, 94, 0.15);
      color: var(--accent-red);
    }

    .note-sub {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    @media (max-width: 480px) {
      .summary { grid-template-columns: 1fr; }
      .card { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
      .card span { margin-bottom: 0; }
      .form-grid { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Rekap Keuangan</h2>
    
    <div class="summary">
      <div class="card"><span>Pemasukan</span><strong id="txtMasuk" class="in">Memuat...</strong></div>
      <div class="card"><span>Pengeluaran</span><strong id="txtKeluar" class="out">Memuat...</strong></div>
      <div class="card"><span>Saldo Akhir</span><strong id="txtSaldo" class="bal">Memuat...</strong></div>
    </div>

    <form id="formTransaksi" onsubmit="kirimData(event)">
      <div class="form-grid">
        <div class="form-group">
          <label>Tanggal</label>
          <input type="date" id="tanggal" required>
        </div>

        <div class="form-group">
          <label>Jenis Transaksi</label>
          <select id="jenis" required>
            <option value="Pemasukan">Pemasukan</option>
            <option value="Pengeluaran">Pengeluaran</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Kategori</label>
        <input type="text" id="kategori" placeholder="Contoh: Gaji, Makan, Operasional" required>
      </div>

      <div class="form-group">
        <label>Nominal (Rp)</label>
        <input type="number" id="nominal" placeholder="Contoh: 50000" required>
      </div>

      <div class="form-group">
        <label>Keterangan</label>
        <input type="text" id="keterangan" placeholder="Catatan tambahan (opsional)">
      </div>

      <button type="submit" id="btnSimpan">Simpan Transaksi</button>
    </form>

    <div class="section-title">5 Transaksi Terakhir</div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr><th>Tanggal</th><th>Kategori</th><th>Jenis</th><th>Nominal</th></tr>
        </thead>
        <tbody id="tabelRiwayat"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzd4Tex0Qxfa4EElY1qVMqusBynPG2-1vN10jBMmEkTCJKdDrfPXjrbaiFXe7MPQ4Pn/exec';

    document.getElementById('tanggal').valueAsDate = new Date();

    function formatRupiah(angka) {
      return 'Rp ' + Number(angka).toLocaleString('id-ID');
    }

    function perbaruiTampilan(data) {
      document.getElementById('txtMasuk').innerText = formatRupiah(data.pemasukan);
      document.getElementById('txtKeluar').innerText = formatRupiah(data.pengeluaran);
      document.getElementById('txtSaldo').innerText = formatRupiah(data.saldo);

      var tbody = document.getElementById('tabelRiwayat');
      tbody.innerHTML = '';
      data.riwayat.forEach(function(item) {
        var badgeClass = item.jenis === 'Pemasukan' ? 'badge-in' : 'badge-out';
        var ketHtml = item.keterangan ? '<span class="note-sub">' + item.keterangan + '</span>' : '';
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + item.tanggal + '</td>' +
                       '<td><strong>' + item.kategori + '</strong>' + ketHtml + '</td>' +
                       '<td><span class="badge ' + badgeClass + '">' + item.jenis + '</span></td>' +
                       '<td><strong>' + formatRupiah(item.nominal) + '</strong></td>';
        tbody.appendChild(tr);
      });
    }

    function muatData() {
      fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(data => perbaruiTampilan(data))
        .catch(err => console.error('Gagal memuat data:', err));
    }

    function kirimData(e) {
      e.preventDefault();
      var btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.innerText = 'Menyimpan...';

      var payload = {
        tanggal: document.getElementById('tanggal').value,
        jenis: document.getElementById('jenis').value,
        kategori: document.getElementById('kategori').value,
        nominal: document.getElementById('nominal').value,
        keterangan: document.getElementById('keterangan').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(res => {
        perbaruiTampilan(res);
        document.getElementById('formTransaksi').reset();
        document.getElementById('tanggal').valueAsDate = new Date();
        btn.disabled = false;
        btn.innerText = 'Simpan Transaksi';
      })
      .catch(err => {
        alert('Gagal menyimpan transaksi.');
        btn.disabled = false;
        btn.innerText = 'Simpan Transaksi';
      });
    }

    window.onload = muatData;
  </script>
</body>
</html>
